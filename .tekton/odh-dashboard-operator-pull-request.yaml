apiVersion: tekton.dev/v1
# konflux build manual retrigger - 2026-08-12 17:56:09
kind: PipelineRun
metadata:
  name: odh-dashboard-operator-on-pull-request-{{pull_request_number}}
  labels:
    appstudio.openshift.io/application: rhoai-v3-7-ea-1
    appstudio.openshift.io/component: odh-dashboard-operator-v3-7-ea-1
    pipelines.appstudio.openshift.io/type: build
  namespace: rhoai-tenant
  annotations:
    pipelinesascode.tekton.dev/on-comment: '^/build-konflux'
    build.appstudio.openshift.io/repo: "https://github.com/red-hat-data-services/odh-dashboard?rev={{revision}}"
    build.appstudio.redhat.com/commit_sha: "{{revision}}"
    build.appstudio.redhat.com/target_branch: "{{target_branch}}"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request"
      && target_branch == "rhoai-3.7-ea.1"
      && konflux_cluster == "stone-prod-p02"
      && ( files.all.exists(p, !p.matches('^\\.tekton/')) || ".tekton/odh-dashboard-operator-pull-request.yaml".pathChanged() )
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-dashboard-operator-rhel9:on-pr-{{pull_request_number}}
  - name: rhoai-version
    value: "3.7.0-ea.1"
  - name: dockerfile
    value: Dockerfile.konflux.dashboard-operator
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: prefetch-input
    value: '[{"path":"dashboard-operator","type":"gomod"}]'
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: 'rhoai-3.7-ea.1'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-dashboard-operator-v3-7-ea-1
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
  timeouts:
    pipeline: 2h
#restart
  taskRunSpecs:
  - pipelineTaskName: rpms-signature-scan
    stepSpecs:
    - name: rpms-signature-scan
      computeResources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "500m"
          memory: "1Gi"
